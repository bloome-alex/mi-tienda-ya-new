name: mi-tienda-ya-2

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USER:?Completá MONGO_ADMIN_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD:?Completá MONGO_ADMIN_PASSWORD en .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-mi_tienda_ya_2}
      MONGO_APP_USER: ${MONGO_APP_USER:?Completá MONGO_APP_USER en .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Completá MONGO_APP_PASSWORD en .env}
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/01-app-user.js:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "const a=db.getSiblingDB('admin'); const result=a.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(result!==1 && result.ok!==1) quit(1); quit(a.runCommand({ping:1}).ok===1?0:1);"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # MongoDB sólo es accesible dentro de la red privada de Compose.
    # No se publica el puerto 27017 en el host.

  app:
    build:
      context: .
      args:
        INSTALL_CHROMIUM: "true"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      APP_URL: ${APP_URL:?Completá APP_URL con una URL pública HTTPS}
      TRUST_PROXY: "1"
      ROOT_USER: ${ROOT_USER:?Completá ROOT_USER en .env}
      ROOT_PASSWORD: ${ROOT_PASSWORD:?Completá ROOT_PASSWORD en .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Generá ENCRYPTION_KEY en .env}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-mi_tienda_ya_2}?authSource=${MONGO_DB_NAME:-mi_tienda_ya_2}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Mi Tienda Ya <no-reply@example.com>}
      ORDER_RESERVATION_MINUTES: ${ORDER_RESERVATION_MINUTES:-60}
      UPLOAD_DIR: /app/api/data/uploads
      WHATSAPP_DATA_PATH: /app/api/data/whatsapp
      WHATSAPP_CLIENT_ID: ${WHATSAPP_CLIENT_ID:-mi-tienda-ya-2}
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      WHATSAPP_NO_SANDBOX: ${WHATSAPP_NO_SANDBOX:-false}
    ports:
      - "127.0.0.1:${HTTP_PORT:-5000}:5000"
    volumes:
      - app_data:/app/api/data
    depends_on:
      mongo:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  mongo_data:
  app_data:
