<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18181b">
  <meta name="color-scheme" content="light dark">
  <title>Sin conexión · MiTiendaYa</title>
  <style>
    :root{color-scheme:light;--background:#f5f5f6;--text:#202024;--muted:#62626a;--primary:#18181b;--on-primary:#fff}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--background:#050607;--text:#f1e7d9;--muted:#a99d8e;--primary:#72e3ad;--on-primary:#06110c}}
    body{font:16px system-ui;background:var(--background);color:var(--text);min-height:100dvh;display:grid;place-items:center;margin:0}
    main{max-width:420px;padding:30px;text-align:center}h1{font-size:30px;letter-spacing:-1px;line-height:1.15}p{color:var(--muted);line-height:1.7}
    a{display:inline-block;background:var(--primary);color:var(--on-primary);padding:13px 20px;border-radius:10px;text-decoration:none;font-weight:600}
    a:focus-visible{outline:3px solid #2196f3;outline-offset:4px}
  </style>
</head>
<body><main>
  <img src="/icons/icon-192.png" width="75" height="75" alt="MiTiendaYa">
  <h1>Nos volvemos a encontrar en un momento.</h1>
  <p>Estás sin conexión. Necesitás conectarte para consultar el catálogo actualizado, guardar cambios o realizar una compra.</p>
  <a href="/">Volver a intentar</a>
</main></body>
</html>
